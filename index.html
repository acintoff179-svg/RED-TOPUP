<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Up BD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #e50914;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ddd;
        }
        
        /* Package Grid */
        .packages {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            background: #2a2a2a;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .card.active {
            border-color: #e50914;
            background: #331013;
        }
        .card .title {
            font-size: 14px;
            font-weight: bold;
        }
        .card .price {
            font-size: 15px;
            color: #e50914;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #bbb;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #e50914;
        }

        /* Payment Methods */
        .payment-box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .payment-info {
            font-size: 14px;
        }
        .payment-info span {
            display: block;
            font-size: 12px;
            color: #aaa;
        }
        .copy-btn {
            background: #e50914;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn:active {
            background: #b20710;
        }

        /* Confirm Button */
        .submit-btn {
            width: 100%;
            background: #e50914;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #b20710;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Diamond Top-Up</h2>

    <!-- Select Package -->
    <div class="section-title">প্যাকেজ নির্বাচন করুন:</div>
    <div class="packages">
        <div class="card" onclick="selectPackage(this, 23)">
            <div class="title">25 Diamonds</div>
            <div class="price">23৳</div>
        </div>
        <div class="card" onclick="selectPackage(this, 45)">
            <div class="title">50 Diamonds</div>
            <div class="price">45৳</div>
        </div>
        <div class="card" onclick="selectPackage(this, 80)">
            <div class="title">115 Diamonds</div>
            <div class="price">80৳</div>
        </div>
        <div class="card" onclick="selectPackage(this, 155)">
            <div class="title">240 Diamonds</div>
            <div class="price">155৳</div>
        </div>
        <div class="card" onclick="selectPackage(this, 235)">
            <div class="title">355 Diamonds</div>
            <div class="price">235৳</div>
        </div>
        <div class="card" onclick="selectPackage(this, 390)">
            <div class="title">610 Diamonds</div>
            <div class="price">390৳</div>
        </div>
    </div>

    <!-- Player UID Input -->
    <div class="input-group">
        <label for="uid">Player UID / ID:</label>
        <input type="number" id="uid" placeholder="আপনার Player UID দিন">
    </div>

    <!-- Payment Methods -->
    <div class="section-title">পেমেন্ট মেথড (Send Money):</div>
    
    <div class="payment-box">
        <div class="payment-info">
            <strong>bKash: 01962575788</strong>
            <span>Send Money</span>
        </div>
        <button class="copy-btn" onclick="copyNumber('01962575788')">Copy Number</button>
    </div>

    <div class="payment-box">
        <div class="payment-info">
            <strong>Rocket: 01992849511</strong>
            <span>Send Money</span>
        </div>
        <button class="copy-btn" onclick="copyNumber('01992849511')">Copy Number</button>
    </div>

    <!-- Transaction ID Input -->
    <div class="input-group" style="margin-top: 15px;">
        <label for="trxId">Transaction ID:</label>
        <input type="text" id="trxId" placeholder="Transaction ID লিখুন">
    </div>

    <!-- Order Button -->
    <button class="submit-btn" onclick="confirmOrder()">CONFIRM ORDER</button>
</div>

<script>
    let selectedPrice = 0;

    function selectPackage(element, price) {
        let cards = document.querySelectorAll('.card');
        cards.forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPrice = price;
    }

    function copyNumber(number) {
        navigator.clipboard.writeText(number);
        alert("নম্বর কপি হয়েছে: " + number);
    }

    function confirmOrder() {
        let uid = document.getElementById('uid').value;
        let trxId = document.getElementById('trxId').value.trim();

        if (selectedPrice === 0) {
            alert("দয়া করে একটি প্যাকেজ সিলেক্ট করুন!");
            return;
        }

        if (uid === "") {
            alert("দয়া করে আপনার Player UID দিন!");
            return;
        }

        if (trxId === "") {
            alert("দয়া করে Transaction ID দিন!");
            return;
        }

        // ট্রানজেকশন আইডি ভ্যালিডেশন (এখানে সঠিক ট্রানজেকশন আইডি সেট করা যাবে)
        // উদাহরণ হিসেবে একটি ভ্যালিড আইডি দেওয়া হলো
        let validTrxIds = ["8N7A6D5C4B", "9K8J7H6G5F"]; 

        if (validTrxIds.includes(trxId)) {
            alert("অর্ডার সফল হয়েছে! আপনার একাউন্টে ডায়মন্ড যোগ করা হবে।");
        } else {
            alert("রং! ভুল ট্রানজেকশন আইডি মামা");
        }
    }
</script>

</body>
</html>
