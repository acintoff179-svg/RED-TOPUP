<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED TOPUP & E-SPORTS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --card-border: #222a38;
            --accent-color: #ff3366;
            --secondary-color: #00e676;
            --text-color: #ffffff;
            --text-gray: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        header {
            background: #151922;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .brand-text h1 {
            font-size: 16px;
            color: #fff;
        }

        .brand-text p {
            font-size: 10px;
            color: var(--text-gray);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
        }

        .section-title {
            font-size: 15px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        /* Tournament List */
        .tournament-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .match-info h3 {
            font-size: 14px;
            color: #fff;
        }

        .match-info p {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 2px;
        }

        .join-btn {
            background: var(--accent-color);
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* Popup Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            color: var(--text-gray);
            cursor: pointer;
        }

        .modal h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background-color: #0b0e14;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background: var(--secondary-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">
            <div class="site-logo"><i class="fa-solid fa-gamepad"></i></div>
            <div class="brand-text">
                <h1>RED TOPUP & E-SPORTS</h1>
                <p>খেলুন এবং প্রতিদিন আয় করুন</p>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">লাইভ টুর্নামেন্ট সমূহ</h2>

        <div class="tournament-card">
            <div class="match-info">
                <h3>ফ্রি ফায়ার ১ বনাম ১ সোলো</h3>
                <p>এন্ট্রি ফি: ২০ টাকা | পুরস্কার: ৩৫ টাকা</p>
            </div>
            <button class="join-btn" onclick="openMatchModal('ফ্রি ফায়ার ১ বনাম ১ সোলো')">জয়েন করুন</button>
        </div>

        <div class="tournament-card">
            <div class="match-info">
                <h3>ফ্রি ফায়ার ৪ বনাম ৪ সিএস ম্যাচ</h3>
                <p>এন্ট্রি ফি: ৫০ টাকা | পুরস্কার: ৯০ টাকা</p>
            </div>
            <button class="join-btn" onclick="openMatchModal('ফ্রি ফায়ার ৪ বনাম ৪ সিএস ম্যাচ')">জয়েন করুন</button>
        </div>
    </div>

    <!-- Join Match Pop-Up Modal -->
    <div id="joinModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeMatchModal()">&times;</span>
            <h3 id="modalMatchTitle">ম্যাচ জয়েন ফর্ম</h3>
            
            <!-- Formspree Endpoint link: আপনার Formspree ID থাকলে বসিয়ে দিন -->
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
                <input type="hidden" id="matchNameInput" name="Match_Name" value="">
                
                <div class="input-group">
                    <label>ইন-গেম নাম (In-Game Name)</label>
                    <input type="text" name="Player_Name" placeholder="যেমন: RED_GAMER" required>
                </div>

                <div class="input-group">
                    <label>প্লেয়ার ইউআইডি (Player UID / Number)</label>
                    <input type="text" name="Player_UID" placeholder="যেমন: 123456789" required>
                </div>

                <div class="input-group">
                    <label>পেমেন্ট ট্রানজেকশন আইডি (TrxID)</label>
                    <input type="text" name="TrxID" placeholder="ফি পাঠানোর TrxID দিন" required>
                </div>

                <button type="submit" class="submit-btn">কনফার্ম জয়েন করুন</button>
            </form>
        </div>
    </div>

    <script>
        function openMatchModal(matchTitle) {
            document.getElementById('modalMatchTitle').innerText = matchTitle;
            document.getElementById('matchNameInput').value = matchTitle;
            document.getElementById('joinModal').style.style.display = 'none'; // reset just in case
            document.getElementById('joinModal').style.display = 'flex';
        }

        function closeMatchModal() {
            document.getElementById('joinModal').style.display = 'none';
        }
    </script>
</body>
</html>
