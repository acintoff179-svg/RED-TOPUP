<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RED TOPUP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:
        radial-gradient(circle at top,#3b0000 0,#090909 45%,#050505 100%);
    color:#fff;
    min-height:100vh;
    padding:15px;
}

.container{
    max-width:480px;
    margin:auto;
    background:#111;
    border:1px solid #2d2d2d;
    border-radius:22px;
    overflow:hidden;
    box-shadow:
        0 0 25px rgba(255,0,0,.15),
        0 15px 50px rgba(0,0,0,.7);
}

/* HEADER */

.header{
    padding:30px 15px;
    text-align:center;
    background:
        linear-gradient(135deg,#ff1717,#a00000 55%,#570000);
}

.header h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 3px 10px #000;
}

.header p{
    margin-top:7px;
    color:#ffe1e1;
    font-size:14px;
}

/* CONTENT */

.content{
    padding:20px;
}

.title{
    color:#ff4242;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

/* CATEGORY */

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.category{
    background:linear-gradient(145deg,#242424,#151515);
    border:1px solid #333;
    border-radius:14px;
    padding:17px 8px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.category:hover{
    transform:translateY(-3px);
    border-color:#ff2222;
}

.category.active{
    background:
        linear-gradient(145deg,#d90000,#730000);
    border-color:#ff4b4b;
    box-shadow:0 5px 15px rgba(255,0,0,.25);
}

.category .icon{
    font-size:25px;
    margin-bottom:6px;
}

/* PRODUCTS */

.products{
    margin-top:23px;
}

.product{
    background:linear-gradient(145deg,#202020,#151515);
    border:2px solid #303030;
    border-radius:13px;
    padding:17px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:.2s;
}

.product:hover{
    transform:translateX(3px);
    border-color:#ff2929;
}

.product.active{
    background:linear-gradient(145deg,#500000,#260000);
    border-color:#ff2222;
    box-shadow:0 0 15px rgba(255,0,0,.15);
}

.product h3{
    font-size:16px;
}

.price{
    color:#ff4141;
    font-size:18px;
    font-weight:bold;
}

/* FORM */

.form-group{
    margin-top:18px;
}

label{
    display:block;
    color:#ddd;
    margin-bottom:7px;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:9px;
    border:1px solid #3d3d3d;
    background:#080808;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#ff2525;
    box-shadow:0 0 8px rgba(255,0,0,.2);
}

/* BKASH */

.payment{
    margin-top:20px;
    padding:20px;
    text-align:center;
    border-radius:14px;
    background:
        linear-gradient(135deg,#e2136e,#a0004d);
    box-shadow:0 8px 20px rgba(226,19,110,.15);
}

.payment h3{
    font-size:20px;
}

.number{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
    margin:10px 0;
}

.send{
    font-size:14px;
}

.copy{
    margin-top:12px;
    padding:10px 17px;
    border:0;
    border-radius:8px;
    background:#fff;
    color:#d0005d;
    font-weight:bold;
    cursor:pointer;
}

/* CONFIRM */

.confirm{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:10px;
    background:
        linear-gradient(90deg,#ff1616,#a90000);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(255,0,0,.2);
}

.confirm:hover{
    transform:translateY(-2px);
}

/* COMPLETE */

.complete{
    display:none;
    margin-top:18px;
    padding:20px;
    border-radius:12px;
    background:#063b20;
    border:1px solid #16b96a;
    text-align:center;
}

.complete-icon{
    font-size:42px;
}

.complete h2{
    color:#25e886;
    margin:7px 0;
}

.complete p{
    color:#d8ffea;
    font-size:14px;
}

/* WHATSAPP */

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 6px 25px rgba(0,0,0,.6);
    z-index:999;
    animation:pulse 2s infinite;
}

.whatsapp span{
    font-size:32px;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(37,211,102,.5);
    }
    70%{
        box-shadow:0 0 0 12px rgba(37,211,102,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(37,211,102,0);
    }
}

/* FOOTER */

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    padding:18px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>RED TOPUP</h1>

        <p>
            ⚡ Fast • Secure • Instant Top-Up
        </p>

    </div>


    <div class="content">

        <!-- CATEGORY -->

        <div class="title">
            🔥 TOP-UP CATEGORY
        </div>

        <div class="category-grid">

            <div class="category active"
                 onclick="showCategory(this,'uid')">

                <div class="icon">🆔</div>
                UID TOP UP

            </div>


            <div class="category"
                 onclick="showCategory(this,'monthly')">

                <div class="icon">📅</div>
                MONTHLY

            </div>


            <div class="category"
                 onclick="showCategory(this,'weekly')">

                <div class="icon">🗓️</div>
                WEEKLY

            </div>


            <div class="category"
                 onclick="showCategory(this,'mystery')">

                <div class="icon">🎁</div>
                MYSTERY BOX

            </div>


            <div class="category"
                 onclick="showCategory(this,'special')">

                <div class="icon">⭐</div>
                SPECIAL

            </div>


            <div class="category"
                 onclick="showCategory(this,'all')">

                <div class="icon">💎</div>
                ALL TOP UP

            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="products">

            <div class="title" id="productTitle">
                💎 UID TOP UP
            </div>

            <div id="productList"></div>

        </div>


        <!-- UID -->

        <div class="form-group">

            <label>
                🆔 Player UID
            </label>

            <input
                type="text"
                id="uid"
                placeholder="আপনার Player UID লিখুন"
            >

        </div>


        <!-- BKASH -->

        <div class="payment">

            <h3>
                📱 bKash Send Money
            </h3>

            <div class="number">
                01962575788
            </div>

            <div class="send">
                এই নম্বরে Send Money করুন
            </div>

            <button
                class="copy"
                onclick="copyNumber()">

                📋 Copy Number

            </button>

        </div>


        <!-- TRANSACTION -->

        <div class="form-group">

            <label>
                🧾 bKash Transaction ID
            </label>

            <input
                type="text"
                id="trx"
                placeholder="Transaction ID লিখুন"
            >

        </div>


        <!-- CONFIRM -->

        <button
            class="confirm"
            onclick="confirmOrder()">

            ✅ CONFIRM ORDER

        </button>


        <!-- COMPLETE -->

        <div
            class="complete"
            id="complete">

            <div class="complete-icon">
                ✅
            </div>

            <h2>
                COMPLETE
            </h2>

            <p>
                আপনার অর্ডার সফলভাবে কনফার্ম হয়েছে।
            </p>

        </div>

    </div>


    <div class="footer">
        RED TOPUP © 2026
    </div>

</div>


<!-- WHATSAPP -->

<a
    class="whatsapp"
    href="https://wa.me/8801962575788"
    target="_blank"
    title="WhatsApp">

    <span>💬</span>

</a>


<script>

/* Selected Product */

let selectedProduct = null;

let selectedCategory = "UID TOP UP";


/* ALL PRODUCTS */

const products = {

    uid:[
        ["25 Diamond","23 BDT"],
        ["100 Diamond","70 BDT"],
        ["115 Diamond","80 BDT"],
        ["240 Diamond","160 BDT"],
        ["610 Diamond","400 BDT"],
        ["1240 Diamond","800 BDT"],
        ["2530 Diamond","1600 BDT"]
    ],


    monthly:[
        ["Monthly Membership","790 BDT"]
    ],


    weekly:[
        ["Weekly Membership","160 BDT"]
    ],


    mystery:[
        ["Mystery Box","100 BDT"],
        ["Premium Mystery Box","200 BDT"]
    ],


    special:[
        ["Special Top Up","300 BDT"],
        ["Premium Special","500 BDT"]
    ],


    all:[
        ["25 Diamond","23 BDT"],
        ["100 Diamond","70 BDT"],
        ["115 Diamond","80 BDT"],
        ["240 Diamond","160 BDT"],
        ["610 Diamond","400 BDT"],
        ["Monthly Membership","790 BDT"],
        ["Weekly Membership","160 BDT"],
        ["Mystery Box","100 BDT"],
        ["Premium Mystery Box","200 BDT"]
    ]

};


/* INITIAL */

showProducts("uid");


/* CATEGORY */

function showCategory(element,category){

    document
    .querySelectorAll(".category")
    .forEach(function(item){

        item.classList.remove("active");

    });


    element.classList.add("active");


    selectedCategory =
        category.toUpperCase();


    showProducts(category);

}


/* SHOW PRODUCTS */

function showProducts(category){

    let list =
        document.getElementById("productList");

    let title =
        document.getElementById("productTitle");


    list.innerHTML = "";

    selectedProduct = null;


    title.innerHTML =
        "💎 " + category.toUpperCase();


    products[category].forEach(function(item){

        let div =
            document.createElement("div");


        div.className =
            "product";


        div.innerHTML = `

            <h3>${item[0]}</h3>

            <div class="price">
                ৳ ${item[1].replace(" BDT","")}
            </div>

        `;


        div.onclick = function(){

            document
            .querySelectorAll(".product")
            .forEach(function(p){

                p.classList.remove("active");

            });


            div.classList.add("active");


            selectedProduct = {

                name:item[0],

                price:item[1]

            };

        };


        list.appendChild(div);

    });

}


/* COPY BKASH */

function copyNumber(){

    navigator.clipboard.writeText(
        "01962575788"
    );

    alert(
        "bKash নম্বর কপি হয়েছে!\n01962575788"
    );

}


/* CONFIRM ORDER */

function confirmOrder(){

    let uid =
        document
        .getElementById("uid")
        .value
        .trim();


    let trx =
        document
        .getElementById("trx")
        .value
        .trim();


    if(!uid){

        alert(
            "অনুগ্রহ করে Player UID লিখুন!"
        );

        return;

    }


    if(!selectedProduct){

        alert(
            "অনুগ্রহ করে একটি প্যাকেজ নির্বাচন করুন!"
        );

        return;

    }


    if(!trx){

        alert(
            "অনুগ্রহ করে Transaction ID লিখুন!"
        );

        return;

    }


    /* COMPLETE */

    document
    .getElementById("complete")
    .style.display = "block";


    /* WHATSAPP MESSAGE */

    let message =
`🔴 RED TOPUP ORDER

📂 Category:
${selectedCategory}

💎 Product:
${selectedProduct.name}

💰 Price:
${selectedProduct.price}

🆔 Player UID:
${uid}

🧾 Transaction ID:
${trx}

📱 Payment:
bKash Send Money

💳 bKash:
01962575788`;


    let url =
        "https://wa.me/8801962575788?text=" +
        encodeURIComponent(message);


    setTimeout(function(){

        window.open(
            url,
            "_blank"
        );

    },500);

}

</script>

</body>
    </html>
